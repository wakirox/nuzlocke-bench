# Monthly, one grouped PR per ecosystem (majors included); CI on the PR shows whether the bumps break anything.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint supports TypeScript < 6.1 only; a TypeScript 7 bump fails npm install and
      # holds back every other update in the group. Drop this once typescript-eslint allows 7.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
