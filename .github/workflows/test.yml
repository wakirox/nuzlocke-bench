name: test

# The repo is public, so Actions minutes are free: test every push to any branch and every pull
# request, on the Node version CI has always used and the current LTS. A newer push cancels a stale run.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm install, not ci: keeps working while package-lock.json catches up with package.json.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
